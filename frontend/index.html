<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f7f8">
    <title>Chatbot AI | Mattia Di Carlo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" 
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body data-persona="normale">
    <div class="soft-glow glow-one"></div>
    <div class="soft-glow glow-two"></div>
    <div class="soft-glow glow-three"></div>

    <main class="app-shell">
        <section class="chat-panel" aria-label="Chatbot AI di Mattia Di Carlo">
            <header class="topbar">
                <div class="brand-block">
                    <div class="logo-mark" aria-hidden="true">
                        <span>AI</span>
                    </div>

                    <div>
                        <p class="eyebrow">Assistente AI personale</p>
                        <h1>ChatBot AI</h1>
                        <p class="subtitle">
                            <span class="status-dot"></span>
                            Creato da Mattia Di Carlo
                        </p>
                    </div>
                </div>

                <div class="controls">
                    <div class="mode-pill" id="modePill" title="Modalità attiva">
                        <span class="mode-icon">✦</span>
                        <span id="modeTitle">Normale</span>
                    </div>

                    <label class="persona-switch" for="personaSelect">
                        <span>Modalità</span>
                        <select id="personaSelect" onchange="setPersona(this.value)">
                            <option value="normale">Normale</option>
                            <option value="pirandello">Pirandello 2.0</option>
                        </select>
                    </label>

                    <button class="ghost-button" id="clearButton" type="button" onclick="clearChat()">
                        Nuova chat
                    </button>
                </div>
            </header>

            <div class="intro-strip">
                <span>AI generativa</span>
                <span>Dialogo naturale</span>
                <span>Pirandello 2.0</span>
                <span>Identità digitale</span>
            </div>

            <div class="suggestions" id="suggestions" aria-label="Suggerimenti rapidi">
                <button onclick="usePrompt('Chi è il tuo creatore?')">
                    Chi è il tuo creatore?
                </button>

                <button onclick="usePrompt('Parlami della vita di Luigi Pirandello')">
                    Vita di Pirandello
                </button>

                <button onclick="usePrompt('Collega intelligenza artificiale e identità')">
                    AI e identità
                </button>

                <button onclick="usePrompt('Spiegami Il fu Mattia Pascal in modo discorsivo')">
                    Il fu Mattia Pascal
                </button>
            </div>

            <div id="chat" aria-live="polite"></div>

            <footer class="input-area">
                <div class="composer">
                    <textarea 
                        id="input" 
                        rows="1" 
                        autocomplete="off" 
                        placeholder="Scrivi una domanda..."
                    ></textarea>

                    <button id="sendButton" type="button" onclick="sendMessage()" aria-label="Invia messaggio">
                        <span>Invia</span>
                        <span class="button-arrow">↑</span>
                    </button>
                </div>

                <p class="input-hint">Invio per mandare · Shift + Invio per andare a capo</p>
            </footer>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
